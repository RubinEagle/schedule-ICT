name: Update schedule data

on:
  schedule:
    # раз в неделю: воскресенье, 15:00 UTC = 18:00 МСК
    - cron: '0 15 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'scripts/**'
      - 'data/**'
      # личное расписание к таблице отношения не имеет — оно собирается при деплое
      - '!data/local-schedule.json'
      - '.github/workflows/update-schedule.yml'

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch xlsx and generate data
        run: npm run data

      - name: Commit and push if changed
        run: |
          git add public/data public/ics
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git commit -m "chore: update schedule data"
          # сгенерированные файлы полностью выводятся из источника, поэтому при конфликте побеждает свежая генерация
          git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          git push origin main
